<!DOCTYPE html>
<html lang="zh-CN" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SingCtl · WebUI</title>
    <meta name="theme-color" content="#090c12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SingCtl" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M13 2 3 14h7l-1 8 10-12h-7l1-8z'/%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23090c12' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='24' height='24' rx='5' fill='%23090c12' stroke='none'/%3E%3Cpath d='M13 2 3 14h7l-1 8 10-12h-7l1-8z' fill='%2338bdf8' stroke='%2338bdf8'/%3E%3C/svg%3E" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('sc-theme');
          var t = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = t;
          document.documentElement.classList.toggle('dark', t === 'dark');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#090c12' : '#f3f6fb');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-primary min-h-screen antialiased selection:bg-sky-500/25 selection:text-sky-300">
    <div id="root"></div>
    <script type="module" src="./src/client/main.tsx"></script>
  </body>
</html>
