name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.4'
  NODE_VERSION: '24'

jobs:
  verify:
    name: Verify Quality Gates & Calculate Version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Typecheck & Build WebUI (Server & Client)
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go Vet & Tests
        run: |
          go vet ./...
          go vet -tags lite ./...
          DEAD=$(go run golang.org/x/tools/cmd/deadcode@v0.53.0 -test ./...)
          if [ -n "$DEAD" ]; then
            echo "::error::Unreachable Go functions detected:"
            echo "$DEAD"
            exit 1
          fi
          go test -race ./internal/...
          go test -race -tags lite ./internal/singbox/ruleset_snapshot/... ./internal/serverweb/... ./internal/cmd/... ./internal/webui/... ./internal/doctor/... ./internal/common/netx/...
          go test -short ./test/...

      - name: Upload Built Server WebUI Static Assets
        uses: actions/upload-artifact@v7
        with:
          name: serverweb-static
          path: internal/serverweb/static
          if-no-files-found: error

      - name: Upload Built Client WebUI Static Assets
        uses: actions/upload-artifact@v7
        with:
          name: webui-static
          path: internal/webui/static
          if-no-files-found: error

      - name: Determine Release Eligibility & Next Version
        id: version
        run: |
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          echo "Latest commit: $COMMIT_SUBJECT"

          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            if echo "$COMMIT_SUBJECT" | grep -Eq '(\[skip release\]|^(docs|style|test|ci)(\([^)]+\))?:)'; then
              echo "Skipping binary release for non-runtime commit."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ -f .upstream-version ]; then
            TARGET_MAJOR=$(tr -d ' \n\r' < .upstream-version)
          else
            TARGET_MAJOR="1.14"
          fi
          echo "Target Upstream Major: $TARGET_MAJOR"

          git fetch --tags --force
          MATCHING_TAGS=$(git tag -l "v${TARGET_MAJOR}.*")
          MAX_PATCH=-1

          if [ -n "$MATCHING_TAGS" ]; then
            for t in $MATCHING_TAGS; do
              p=$(echo "$t" | awk -F. '{print $3}')
              if [ -n "$p" ] && [ "$p" -eq "$p" ] 2>/dev/null; then
                if [ "$p" -gt "$MAX_PATCH" ]; then
                  MAX_PATCH=$p
                fi
              fi
            done
          fi

          if [ "$MAX_PATCH" -lt 0 ]; then
            NEXT_VERSION="${TARGET_MAJOR}.0"
          else
            NEXT_PATCH=$((MAX_PATCH + 1))
            NEXT_VERSION="${TARGET_MAJOR}.${NEXT_PATCH}"
          fi

          TAG_NAME="v${NEXT_VERSION}"
          echo "Prepared release version: $TAG_NAME"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

  build_and_release:
    name: Build Matrix & Publish Release
    runs-on: ubuntu-latest
    needs: verify
    if: needs.verify.outputs.should_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore Built Server WebUI Static Assets
        uses: actions/download-artifact@v8
        with:
          name: serverweb-static
          path: internal/serverweb/static

      - name: Restore Built Client WebUI Static Assets
        uses: actions/download-artifact@v8
        with:
          name: webui-static
          path: internal/webui/static

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Build Cross-Platform SingCtl Binaries
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify.outputs.tag_name }}"
          BUILD_TIME="$(date -u '+%Y-%m-%d_%H:%M:%S')"
          GIT_COMMIT="$(git rev-parse --short HEAD)"
          LDFLAGS="-X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME} -X main.GitCommit=${GIT_COMMIT} -s -w"

          mkdir -p dist/{linux-amd64,linux-arm64,linux-amd64-lite,linux-arm64-lite,darwin-arm64,darwin-amd64,windows-amd64,windows-arm64}

          # Linux / OpenWrt (with embedded rule snapshots)
          # 性能架构说明：保留原生精简 ELF（-trimpath -s -w），不加 UPX 壳。
          # UPX 运行时自解压会将 ~22MB 代码段和数据段全部灌入每进程的私有匿名内存（RssAnon），
          # 无法在双守护进程（dm+web / ui+sub）间通过 mmap 共享只读文件页（RssFile），且增加 CLI 启动解压延迟。
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "${LDFLAGS}" -o dist/linux-amd64/singctl ./cmd/singctl

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "${LDFLAGS}" -o dist/linux-arm64/singctl ./cmd/singctl

          # Linux / OpenWrt Lite (<=512MB RAM / 128MB small-flash client routers: pure-client build stripping server/fleet/SSH/speedtest deps, embedded rulesets & server WebUI; embeds precompressed .gz client WebUI)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags lite -trimpath -ldflags "${LDFLAGS}" -o dist/linux-amd64-lite/singctl ./cmd/singctl
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags lite -trimpath -ldflags "${LDFLAGS}" -o dist/linux-arm64-lite/singctl ./cmd/singctl

          # macOS (Apple Silicon & Intel — un-UPX'd for macOS Gatekeeper compatibility)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "${LDFLAGS}" -o dist/darwin-arm64/singctl ./cmd/singctl
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "${LDFLAGS}" -o dist/darwin-amd64/singctl ./cmd/singctl

          # Windows (AMD64 & ARM64)
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "${LDFLAGS}" -o dist/windows-amd64/singctl.exe ./cmd/singctl
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags "${LDFLAGS}" -o dist/windows-arm64/singctl.exe ./cmd/singctl

      - name: Package Archives & Generate SHA256 Checksums
        run: |
          set -euo pipefail
          cd dist

          for platform_dir in linux-amd64 linux-arm64 linux-amd64-lite linux-arm64-lite darwin-arm64 darwin-amd64; do
            package_name="singctl-${platform_dir}"
            mkdir -p "${package_name}"
            cp "${platform_dir}/singctl" "${package_name}/"
            cp -r ../configs "${package_name}/"
            tar -czf "${package_name}.tar.gz" "${package_name}"
            rm -rf "${package_name}" "${platform_dir}"
          done

          for win_dir in windows-amd64 windows-arm64; do
            package_name="singctl-${win_dir}"
            mkdir -p "${package_name}"
            cp "${win_dir}/singctl.exe" "${package_name}/"
            cp -r ../configs "${package_name}/"
            zip -rq "${package_name}.zip" "${package_name}"
            rm -rf "${package_name}" "${win_dir}"
          done

          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Generate Release Notes from Commits
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAG_NAME="${{ needs.verify.outputs.tag_name }}"
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "$TAG_NAME" | head -n 1 || true)
          RANGE="${PREV_TAG:+${PREV_TAG}..HEAD}"
          RANGE="${RANGE:-HEAD}"

          {
            echo "## What's Changed"
            echo ""
            COMMIT_LOG=$(git log "$RANGE" --no-merges --format="### %s (\`%h\`)%n%n%b%n---%n")
            if [ -z "${COMMIT_LOG// }" ]; then
              COMMIT_LOG=$(git log -1 --format="### %s (\`%h\`)%n%n%b%n")
            fi
            printf '%s\n' "$COMMIT_LOG"
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG_NAME}"
            fi
          } > /tmp/release-notes.md

      - name: Tag Commit & Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify.outputs.tag_name }}
          name: ${{ needs.verify.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          body_path: /tmp/release-notes.md
          generate_release_notes: false
          make_latest: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune Old Releases & Orphan Tags (Keep Latest 3)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RELEASES: '3'
          KEEP_RUNS: '15'
        run: |
          chmod +x scripts/cleanup-releases.sh
          ./scripts/cleanup-releases.sh 3

