subs:
  - name: "main"                              # 订阅名称 (多订阅时必填)
    url: ""                                   # 你VPN订阅地址
    skip_tls_verify: false                    # 是否跳过TLS验证
    remove-emoji: true
    # include: ""                             # (可选) 仅保留匹配正则的节点 (如 "HK|SG|JP")
    # exclude: ""                             # (可选) 剔除匹配正则的节点 (如 "剩余|到期|官网|流量")
    # rename:                                 # (可选) 按正则顺序批量重命名节点
    #   - {match: " Premium$", replace: ""}
  # 多订阅示例 (可选):
  # - name: "backup"
  #   url: "https://example.com/subscription"
  #   skip_tls_verify: false
  #   remove-emoji: true

github:
  mirror_url: "https://gh-proxy.com"            # GitHub镜像地址,用于加速

hy2:
  up: 20                                         # Hysteria2 上行带宽 (Mbps)
  down: 200                                      # Hysteria2 下行带宽 (Mbps)

# low_memory: "auto"                             # (可选) 低内存路由器自适应模式: "auto" (默认: MemTotal<=512MiB 或 MemAvailable<=256MiB 自动启用) | "on" | "off"

dns:                                             # (可选) 客户端本地防劫持 DNS (AdGuard Home) 配置
  enabled: true                                  # 是否启用本地 AdGuard Home 接管 dns_local
  dns_port: 5353                                 # 本地 DNS 监听端口 (仅绑定 127.0.0.1)
  web_port: 3000                                 # Web 管理面板端口 (仅绑定本机局域网 IP)
  username: "root"                               # 管理面板账号 (安装时可自定义，回车默认 root)
  password: ""                                   # 管理面板密码 (留空首次安装自动生成随机强密码)

gateway:                                         # (可选) 客户端网关部署模式配置
  mode: "main"                                   # "main" (默认主路由模式) | "side" (旁路由单臂网关模式)
  # work_mode: "auto"                            # "auto" (有订阅=代理, 无订阅=审计) | "audit" | "proxy" | "delegated" (主路由纯网关直通托管给旁路由)
  main_router_ip: ""                             # (旁路由模式必填) 上级主路由/网关 IP，例如 "192.168.1.1"
  # side_router_ip: ""                           # (主路由旁路由托管模式可选) 局域网旁路由 IP，例如 "192.168.1.2"
  # side_router_failover: true                   # (旁路由托管默认 true) 旁路由连续失联时自动摘除策略路由回退主路由直连
  # modem_ip: ""                                 # (可选) 指定上游光猫私网 IPv4 地址（留空自动探测）
  # lan_iface: ""                                # (可选) 指定单臂局域网网卡名，留空自动探测
  ipv6_mode: "off"                               # "off" (纯 IPv4) | "cn_only" (推荐：国内原生 IPv6 + 海外 0ms 静音 AAAA 防泄漏) | "full" (全量双栈；旁路由自动保持 off)

tailscale:                                      # (可选) Tailscale 部署配置
  auth_key: ""                                  # (可选) Tailscale 授权密钥。默认是: ""
  subnets: ""                                   # (可选) 配置通告的子网，默认为空，程序会自动获取
  use_build: false                              # (可选) 是否使用singbox内置的TailScale。默认：false, 不启用
  # p2p_assist:                                 # (可选) Tailscale P2P 直连防线（零常驻公网暴露 + 网段/单设备双向管控 + 下游边界微窗）
  #   enabled: false
  #   role_mode: "router"                       # client | router | exit | gateway
  #   jit_window_sec: 5                         # 瞬时打洞白名单窗口（秒，3~10，默认 5）
  #   cooldown_sec: 300                         # 连续失败退避冷却（秒，默认 300；退避期间继续经 DERP 转发）
  #   payload_filter: true                      # Layer 2 内核 DISCO/WireGuard/STUN 魔法头校验
  #   downstream_assist: true                   # 主路由未跑 Tailscale 时，为下游路由/NAS 提供出站触发式 5s 边界动态微窗（默认 true）
  #   sandbox_ujail: false                      # (可选) Layer 3 OpenWrt ujail 沙盒隔离
  #   local_rules:                              # (可选) 按网段与单台设备精细管控进出组网权限
  #     - cidr: "192.168.1.0/24"
  #       scope: "all"                          # all | allowlist | denylist
  #       devices:
  #         - "192.168.1.10"
  #   peers:
  #     - name: "router-remote"
  #       jit_enabled: true
  #       access_mode: "outbound_only"          # outbound_only | bidirectional_timed | bidirectional
  #       bidirectional_until: ""
  #       allowed_lan_targets:
  #         - "192.168.1.0/24"

server: # (可选) 服务器部署配置.当需要部署singbox服务端的时候配置
  node_tag: "" # (可选) 节点地区/代号 (例如: los, sg, hk)，留空自动根据公网 IP 智能识别
  node_domain: "node.example.com" # 你的域名（用于 SubHub 订阅与 Hysteria 2）
  # hy2_port: 443 # (可选) Hysteria 2 (UDP) 对外监听与订阅端口，默认 443；NAT 小鸡可指定独立 UDP 端口 (如 11501)
  # vless_port: 443 # (可选) VLESS Reality (TCP) 与 HTTPS 网关对外监听与订阅端口，默认 443；NAT 小鸡可指定独立 TCP 端口 (如 11502)
  substore_domain: "" # (可选) 订阅聚合专属域名，留空默认使用 node_domain
  server_ip: "" # (可选) 公网 IP 地址（未填自动探测用于申请 Let's Encrypt 原生 IP 证书）
  cf_dns_key: "your_cloudflare_api_token" # 你的 Cloudflare API Token
  sni: "" # (可选) Reality SNI 伪装域名。默认: swdist.apple.com
  # web_admin: # (可选) 服务端专属管理后台 (通过 Caddy HTTPS 自动反代，免开公网端口)
  #   enabled: true
  #   port: 8092
  #   path: "" # (留空首次部署自动生成随机安全路径如 /sr/k9X2Mn8Pq4Rw7T1Z)
  #   username: "singctl"
  #   password: "" # (留空首次部署自动生成高强度随机密码)
  # warp_routing: # (可选) 服务端 WARP 智能分流策略 (可在 WebUI WARP 分流中心可视化管理)
  #   mode: "split" # split (按需分流) | global_warp (全局 WARP) | bypass (全直出旁路)
  #   presets:
  #     reddit: true
  #   warp_domains:
  #     - "example.com"
  #   warp_cidrs:
  #     - "198.51.100.0/24"
  #   direct_domains:
  #     - "direct.example.com"

watchdog:                                      # (可选) 看门狗守护进程配置 (singctl dm)
  interval: 180                                 # 检查间隔(秒), 默认 180
  confirm_wait: 30                              # 检测失败后二次确认等待(秒), 默认 30
  max_restarts: 3                               # 每小时最大自动重启次数, 默认 3
  sub_sync_interval: 600                        # 订阅节点变化自动无感同步间隔(秒), 默认 600 (10分钟; 设为 -1 关闭)
  # preserve_manual_config: true                # 刷新订阅或更新版本时是否自动保留 config.json 手动修改, 默认 true
  # auto_start: true                            # 是否开启路由器开机自启动与掉电恢复, 默认 true (可在 WebUI 系统与维护页一键开关)
  # auto_update:                                # (可选) 核心组件后台自动更新开关 (默认全部关闭，可在 WebUI 系统与维护页按需开启)
  #   singctl: false                            # SingCtl 本体自动更新 (自动识别完整版 / -lite，更新后平滑重启 dm 与 WebUI)
  #   singbox: false                            # sing-box 内核自动更新 (含配置预校验与失败自动回滚)
  #   adguard_home: false                       # AdGuard Home 自动更新 (无损保留既有规则与配置)
  #   tailscale: false                          # Tailscale 自动更新 (走零失联预检与自动回滚切换器)
  #   interval_hours: 24                        # 定时检查周期 (小时, 6~168, 默认 24)
  # failover:                                   # (可选) 策略组自动故障切换配置 (默认开启, 可在 WebUI 看门狗页可视化配置)
  #   enabled: true                             # 是否启用故障切换与恢复回切, 默认 true
  #   groups: ["Proxy", "AI", "#VPS"]           # 默认仅守护活跃核心组 (不含底层闲置单节点池 #Nodes)
  #   patrol_interval: 300                      # 巡检间隔(秒), 默认 300 (5分钟)
  #   probe_timeout_ms: 5000                    # 探测超时(毫秒), 默认 5000
  #   confirm_retries: 2                        # 切备前阶梯复测确认次数, 默认 2 (5s -> 8s 退避防瞬时丢包误切)
  #   failback_cooldown: 180                    # 切备后自动回切冷却期(秒), 默认 180 (设为 -1 关闭自动回切)
  #   max_failback_delay_ms: 600                # 原主选恢复回切允许最高延迟(毫秒), 默认 600

