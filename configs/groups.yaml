# /etc/singctl/groups.yaml —— 声明式策略组编排配置（零节点隐私信息，可跨设备复用）
# 说明：
#   1. 本文件仅描述「需要哪些分组、按什么条件筛选节点」，不含任何订阅 URL 或节点凭据。
#   2. 每次刷新订阅、节点扩缩容或重生成配置时，SingCtl 会自动按规则动态归类节点。
#   3. 若某个分组暂时匹配到 0 个节点，编译器会自动回退兜底出站（默认 #Auto / #DC），绝不断网。
#
# 内置语义宏（可直接写在 match / exclude 中，免手写复杂正则）：
#   @hk (香港)  @tw (台湾)  @jp (日本)  @sg (新加坡)  @kr (韩国)  @us (美国)  @eu (欧洲)
#   @self (sec_ 自建节点)   @home (家宽/原生住宅)     @iplc (IPLC/IEPL专线)  @high_rate (高倍率与流量提示节点)

version: 1

# merge (默认推荐)：保留内置 Proxy / AI / #VPS / #Auto / #Nodes / #DC 骨架，在此基础上新增或覆写分组
# replace (高阶模式)：完全按本文件定义的 groups 顺序构建（仍保留 #DC）；约定优于配置：
#                    存在 Proxy 则默认兜底走 Proxy，否则严格走第 1 个分组；海外 DNS 存在 #VPS 走 #VPS，否则跟随默认兜底组
mode: merge

groups: []
